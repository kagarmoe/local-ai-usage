id: 422542ed-35bf-48c3-9612-9c4d8bc634d9
name: local-ai-usage-weekly
tags: {}
reports:
  require: ["@kagarmoe/local-ai-usage-report"]
jobs:
  - name: scan
    steps:
      - name: scan-claude-code
        task:
          type: model_method
          modelIdOrName: claude-code
          methodName: scanMissing
          inputs: {}
        allowFailure: true
      - name: scan-codex
        task:
          type: model_method
          modelIdOrName: codex
          methodName: scanMissing
          inputs: {}
        allowFailure: true
  - name: build
    dependsOn:
      - job: scan
        condition:
          type: completed
    steps:
      - name: build-summary
        task:
          type: model_method
          modelIdOrName: summary
          methodName: build
          inputs: {}
  - name: publish
    dependsOn:
      - job: build
        condition:
          type: succeeded
    steps:
      - name: publish
        task:
          type: model_method
          modelIdOrName: publish
          methodName: publish
          inputs: {}
  - name: dashboard
    dependsOn:
      - job: build
        condition:
          type: succeeded
    steps:
      - name: render
        task:
          type: model_method
          modelIdOrName: dashboard-data
          methodName: render
          inputs: {}
      - name: upload
        dependsOn:
          - step: render
            condition:
              type: succeeded
        # Skips unchanged data (the workflow runs at login and at 09:17); works before the first upload.
        guard: '${{ data.latest("dashboard-upload", "upload").?attributes.?hash.orValue("") == data.latest("dashboard-data", "data").attributes.hash }}'
        task:
          type: model_method
          modelIdOrName: dashboard-upload
          methodName: put
          inputs:
            files: '${{ data.latest("dashboard-data", "data").attributes.files }}'
            hash: '${{ data.latest("dashboard-data", "data").attributes.hash }}'
version: 1
