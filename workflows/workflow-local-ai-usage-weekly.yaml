id: 422542ed-35bf-48c3-9612-9c4d8bc634d9
name: local-ai-usage-weekly
tags: {}
reports:
  require: ["@kagarmoe/local-ai-usage-report"]
trigger:
  # swamp serve on Hestia (WSL) fires this; the scans run on hippolyta, where the logs are.
  # Four times a day so a run lands while hippolyta is awake; scans only add missing weeks, and
  # upload is a no-op when nothing changed.
  schedule: "17 9,13,17,21 * * *"
jobs:
  - name: prices
    steps:
      - name: load-prices
        task:
          type: model_method
          modelIdOrName: prices
          methodName: load
          inputs: {}
  - name: scan
    dependsOn:
      - job: prices
        condition:
          type: succeeded
    # On a worker: the logs live only on hippolyta. A worker has no checkout, so prices come in as data.
    labels:
      host: hippolyta
    steps:
      - name: scan-claude-code
        task:
          type: model_method
          modelIdOrName: claude-code
          methodName: scanMissing
          inputs:
            prices: '${{ data.latest("prices", "prices").attributes }}'
        allowFailure: true
      - name: scan-codex
        task:
          type: model_method
          modelIdOrName: codex
          methodName: scanMissing
          inputs:
            prices: '${{ data.latest("prices", "prices").attributes }}'
        allowFailure: true
  - name: build
    dependsOn:
      - job: scan
        condition:
          type: completed
    steps:
      - name: merge-prices
        task:
          type: model_method
          modelIdOrName: prices
          methodName: merge
          inputs: {}
      - name: build-summary
        task:
          type: model_method
          modelIdOrName: summary
          methodName: build
          inputs: {}
  - name: dashboard
    dependsOn:
      - job: build
        condition:
          type: succeeded
    steps:
      - name: render
        task:
          type: model_method
          modelIdOrName: dashboard-data
          methodName: render
          inputs: {}
      - name: upload
        dependsOn:
          - step: render
            condition:
              type: succeeded
        # Skips unchanged data (the workflow runs four times a day); works before the first upload.
        guard: '${{ data.latest("dashboard-upload", "upload").?attributes.?hash.orValue("") == data.latest("dashboard-data", "data").attributes.hash }}'
        task:
          type: model_method
          modelIdOrName: dashboard-upload
          methodName: put
          inputs:
            files: '${{ data.latest("dashboard-data", "data").attributes.files }}'
            hash: '${{ data.latest("dashboard-data", "data").attributes.hash }}'
  # Failures only (it runs four times a day); a Discord outage must not fail the run.
  - name: notify-failed
    description: An earlier job failed, so dashboard did not succeed
    dependsOn:
      - job: dashboard
        condition:
          type: not
          condition:
            type: succeeded
    steps:
      - name: post-failed
        task:
          type: model_method
          modelIdOrName: ai-usage-alerts
          methodName: send
          inputs:
            content: "❌ local-ai-usage-weekly failed, so the dashboard was not updated. Details (WSL ~/repos/local-ai-usage): swamp report get @swamp/workflow-summary --workflow local-ai-usage-weekly"
            username: local-ai-usage
        allowFailure: true
version: 1
